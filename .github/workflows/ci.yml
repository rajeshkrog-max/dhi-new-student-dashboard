# Checks on every pull request and every push to main (spec 0006).
#
# Read only, no secrets, no deploy credentials, and nothing here talks to Convex or Cloudflare.
# The browser tests (test:e2e), the auth check and the smoke run need a running server or a
# development deployment, so they are not run here.
#
# Each third party action is pinned to a full commit SHA (the comment names the release), so a moved
# tag cannot change what runs. To update one, take the new release's commit from its release page.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor named in package.json "engines" (22.19.0: the funnel's undici needs it),
        # and the version used locally (.node-version).
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm look:check
      - run: pnpm test
      - run: pnpm build:all
